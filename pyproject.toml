[project]
name = "vector-graph-rag"
version = "0.2.2"
description = "A Graph RAG implementation using pure vector search with Milvus"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "zc277584121" }
]
keywords = ["rag", "graph-rag", "milvus", "vector-search", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pymilvus>=2.4.0,<2.6.10",
    "milvus-lite>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tqdm>=4.65.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.0",
    "langchain-core>=0.3.0",
    "python-multipart>=0.0.22",
    "setuptools<71",  # Required for pkg_resources used by milvus-lite
]

[project.optional-dependencies]
jev = ["httpx>=0.27"]
evaluation = ["matplotlib>=3.9"]
dev = [
    "opentelemetry-sdk>=1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
hf = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
google = [
    "google-genai>=1.0",
]
voyage = [
    "voyageai>=0.3",
]
jina = [
    "httpx>=0.27",
]
mistral = [
    "mistralai>=1.0",
]
ollama = [
    "ollama>=0.4",
]
local = [
    "einops>=0.8.2",
    "sentence-transformers>=3.0",
    "torch>=2.0.0",
]
onnx = [
    "onnxruntime>=1.17,<1.24; python_version == '3.10'",
    "onnxruntime>=1.17; python_version >= '3.11'",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
]
observability = [
    "opentelemetry-api>=1.0",
]
all = [
    "vector-graph-rag[dev,api,hf,google,voyage,jina,jev,mistral,ollama,local,onnx,observability]",
]
loaders = [
    "markitdown[docx,pdf]>=0.1.4",
    "trafilatura>=2.0.0",
    "lxml_html_clean",  # Required by trafilatura/justext
]
docling = [
    "trafilatura>=2.0.0",
    "lxml_html_clean",  # Required by trafilatura/justext
    "docling>=2.0.0",
]
mineru = [
    "markitdown[docx,pdf]>=0.1.4",
    "trafilatura>=2.0.0",
    "lxml_html_clean",  # Required by trafilatura/justext
    "mineru[pipeline]>=3.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
]

# ==================== PyTorch Index Configuration ====================
# Define PyTorch indexes for different backends

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Default: use CPU for macOS, CUDA 12.4 for Linux
# Can be overridden by environment or Docker build args
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[project.urls]
Homepage = "https://github.com/zilliztech/vector-graph-rag"
Documentation = "https://zilliztech.github.io/vector-graph-rag/"
Repository = "https://github.com/zilliztech/vector-graph-rag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "trafilatura>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_graph_rag"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cc-use",
    "/.memsearch",
    "/blog",
    "/dist",
    "/evaluation/temp_logs",
    "/frontend/docs",
    "/logo_candidates",
    "/output",
    "/screenshots",
    "/site",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
